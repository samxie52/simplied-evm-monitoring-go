<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以太坊监控系统 - 仪表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-healthy { background-color: #52c41a; }
        .status-warning { background-color: #faad14; }
        .status-error { background-color: #ff4d4f; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1890ff;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 500;
        }

        .metric-value {
            font-weight: 600;
            font-size: 1.1em;
        }

        .alert-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid;
        }

        .alert-high { 
            background-color: #fff2f0; 
            border-left-color: #ff4d4f; 
        }

        .alert-medium { 
            background-color: #fffbe6; 
            border-left-color: #faad14; 
        }

        .alert-low { 
            background-color: #f6ffed; 
            border-left-color: #52c41a; 
        }

        .alert-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .alert-time {
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background-color: #fff2f0;
            color: #ff4d4f;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }

        .refresh-btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .refresh-btn:hover {
            background: #40a9ff;
        }

        .last-updated {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 以太坊监控系统</h1>
            <p>实时监控以太坊网络状态和告警信息</p>
            <div style="margin-top: 15px;">
                <span id="system-status">
                    <span class="status-indicator status-healthy"></span>
                    系统运行正常
                </span>
                <button class="refresh-btn" onclick="refreshAllData()" style="margin-left: 20px;">
                    🔄 刷新数据
                </button>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- 系统状态卡片 -->
            <div class="card">
                <div class="card-title">📊 系统状态</div>
                <div id="system-metrics">
                    <div class="loading">正在加载系统状态...</div>
                </div>
            </div>

            <!-- 告警统计卡片 -->
            <div class="card">
                <div class="card-title">⚠️ 告警统计</div>
                <div id="alert-stats">
                    <div class="loading">正在加载告警统计...</div>
                </div>
            </div>

            <!-- 以太坊状态卡片 -->
            <div class="card">
                <div class="card-title">⛓️ 以太坊网络</div>
                <div id="ethereum-status">
                    <div class="loading">正在加载以太坊状态...</div>
                </div>
            </div>
        </div>

        <!-- 最近告警列表 -->
        <div class="card">
            <div class="card-title">🚨 最近告警</div>
            <div id="recent-alerts">
                <div class="loading">正在加载最近告警...</div>
            </div>
        </div>

        <div class="last-updated">
            最后更新时间: <span id="last-update-time">--</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
